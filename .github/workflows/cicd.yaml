name: Webdriver CI/CD

on:
  push:
    branches:
      - main
    paths:
      - webdriver-*/**
      - cicd/*
  workflow_dispatch:
    
jobs:
  env-setup:
    runs-on: ubuntu-latest
    outputs:
      buildid: ${{ steps.buildid.outputs.BUILD_ID }}
    steps:
      - name: Create Build Id
        id: buildid
        run: echo "BUILD_ID=$(date +%Y%m%d%H%I%S)" >> $GITHUB_OUTPUT

  build-test:
    runs-on: ubuntu-latest
    needs: env-setup
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.PACKAGE_UPLOAD_USER_NAME }}
          password: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./cicd/Dockerfile.build
          push: true
          tags: ghcr.io/pyrethrum/webdriver-build:${{needs.env-setup.outputs.buildid}}
          cache-from: type=registry,ref=ghcr.io/pyrethrum/webdriver-build:cache
          cache-to: type=registry,ref=ghcr.io/pyrethrum/webdriver-build:cache,mode=max
      - name: Test
        run: |
          BUILD_IMAGE=ghcr.io/pyrethrum/webdriver-build:${{needs.env-setup.outputs.buildid}}
          docker build -f ./cicd/Dockerfile.test_firefox --build-arg BUILD_IMAGE=$BUILD_IMAGE .
          docker build -f ./cicd/Dockerfile.test_chrome --build-arg BUILD_IMAGE=$BUILD_IMAGE .
